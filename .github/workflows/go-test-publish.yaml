on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: 'ubuntu-latest'
      go-version:
        type: string
        required: false
        default: 'oldstable'
      pr-comment:
        type: string
        required: false
        default: outdate # always|edit|replace|outdate|off
      pr-comment-content:
        type: string
        required: false
        default: report # report|link
jobs:
  publish-tests:
    name: Publish coverage for go ${{ inputs.go-version }} on ${{ input.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    env:
      variant: ${{ format('coverage-{0}-{1}', inputs.runs-on, inputs.go-version) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.variant }}
          path: new-coverage
      - if: github.event_name == 'push'
        run: |

          set -x
          if [[ ! -f new-coverage/coverage.sum ]]; then
            echo "::warning::No coverage summary artifact found"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/notes/*:refs/notes/*" --depth=100 || true
          git notes --ref go-coverage-$variant add -f -F "new-coverage/coverage.sum" "${{ github.sha }}"

          for i in {1..3}; do
            git push origin "refs/notes/*" && break || {
              echo "::warning::pushing notes failed ($i); pulling fresh and retrying"
              git fetch origin "+refs/notes/*:refs/notes/*" --depth=100 || true
              git notes --ref go-coverage-$variant merge -s ours origin/refs/notes/go-coverage || true
            }
          done
      - if: github.event_name == 'pull_request' && inputs.pr-comment != 'off' && hashFiles('new-coverage/coverage.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_STRATEGY: ${{ inputs.pr-comment }}
          COMMENT_CONTENT: ${{ inputs.pr-comment-content == 'link' && 'new-coverage/coverage-link.md' || 'new-coverage/coverage.md' }}
        run: |

          set -x

          if [[ ! "$COMMENT_STRATEGY" =~ ^(always|edit|replace|outdate)$ ]]; then
            echo "::error::invalid strategy $COMMENT_STRATEGY. Must be always, edit, replace, outdate, or off."
            exit 1
          fi

          if [[ ! -f "$COMMENT_CONTENT" ]]; then
            echo "::error::comment content file $COMMENT_CONTENT missing."
            exit 1
          fi

          TAG="<!-- go-coverage-tag: $variant -->"
          echo -e "\n\n$TAG" >> "$COMMENT_CONTENT"
          EXISTING="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | jq --arg t "$TAG" -r '.[] | select((.body | contains($t)) and .user.login == "github-actions[bot]" and (.minimized | not)) | "\(.id):\(.node_id)"')"
          if [[ -n "$EXISTING" ]]; then
            if [[ "$COMMENT_STRATEGY" == "edit" ]]; then
              LATEST="$(tail -n 1 <<<"$EXISTING")"
              echo "Updating existing comment $EXISTING"
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/${LATEST%%:*}" -F body=@"$COMMENT_CONTENT"
              exit 0
            elif [[ "$COMMENT_STRATEGY" == "replace" ]]; then
              echo "Replacing existing comment $EXISTING"
              for COMMENT in $EXISTING; do
                gh api -X DELETE "/repos/$GITHUB_REPOSITORY/issues/comments/${COMMENT%%:*}" || true
              done
            elif [[ "$COMMENT_STRATEGY" == "outdate" ]]; then
              echo "Outdating existing comment $EXISTING"
              for COMMENT in $EXISTING; do
                gh api graphql -F comment_node_id="${COMMENT#*:}" -f query='
                  mutation($comment_node_id: ID!) {
                    minimizeComment(input: {subjectId: $comment_node_id, classifier: OUTDATED}) {
                      minimizedComment { isMinimized }
                    }
                  }' || true
              done
            fi
          fi

          echo "Posting new coverage report to PR" # fallback / requested always
          gh pr comment "$PR_NUMBER" --body-file "$COMMENT_CONTENT"
