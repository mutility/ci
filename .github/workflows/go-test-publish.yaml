on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: 'ubuntu-latest'
      go-version:
        type: string
        required: false
        default: 'oldstable'
      pr-comment:
        type: string
        required: false
        default: replace # always|edit|replace|off
jobs:
  publish-tests:
    runs-on: ${{ inputs.runs-on }}
    env:
      label: ${{ format('coverage-{0}-{1}', inputs.runs-on, inputs.go-version) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.label }}
          path: new-coverage
      - if: github.event_name == 'push'
        run: |

          set -x
          if [[ ! -f new-coverage/coverage.sum ]]; then
            echo "::warning::No coverage summary artifact found"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/notes/*:refs/notes/*" --depth=100 || true
          git notes --ref go-coverage add -f -F "new-coverage/coverage.sum" "${{ github.sha }}"

          for i in {1..3}; do
            git push origin "refs/notes/*" && break || {
              echo "::warning::pushing notes failed ($i); pulling fresh and retrying"
              git fetch origin "+refs/notes/*:refs/notes/*" --depth=100 || true
              git notes --ref go-coverage merge -s ours origin/refs/notes/go-coverage || true
            }
          done
      - if: github.event_name == 'pull_request' && (inputs.pr-comment == 'always' || inputs.pr-comment == 'edit' || inputs.pr-comment == 'replace') && hashFiles('new-coverage/coverage.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_STRATEGY: ${{ inputs.pr-comment }}
        run: |+

          set -x

          TAG="<!-- go-coverage-tag: $label -->"
          echo -e "\n\n$TAG" >> new-coverage/coverage.md
          COMMENT_ID="$(gh pr view "$PR_NUMBER" --json comments | jq --arg t "$TAG" -r '.comments[] | select(.body | contains($t)) | .id' | head -n 1)"
          if [[ -n "$COMMENT_ID" ]]; then
            if [[ "$COMMENT_STRATEGY" == "edit" ]]; then
              echo "Updating existing comment $COMMENT_ID"
              gh pr comment "$PR_NUMBER" --edit-comment "$COMMENT_ID" --body-file new-coverage/coverage.md
              exit 0
            elif [[ "$COMMENT_STRATEGY" == "replace" ]]; then
              echo "Replacing existing comment $COMMENT_ID"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/pulls/comments/$COMMENT_ID" || gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" || true
            fi
          fi

          echo "Posting new coverage report to PR" # fallback / requested always
          gh pr comment "$PR_NUMBER" --body-file new-coverage/coverage.md

